name: CI

on:
    pull_request:
        branches: [main, dev]

jobs:
    lint:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - name: Installer les dépendances
              run: npm ci

            - name: Passer le linter
              run: npm run lint

    format:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - name: Installer les dépendances
              run: npm ci

            - name: Vérifier le formatage des fichiers
              run: npm run format:check
